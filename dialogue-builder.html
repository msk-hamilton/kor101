<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대화 만들기 · Dialogue Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAFF; --surface:#FFFFFF; --ink:#2A2340; --muted:#6B6385; --line:#DDD6EE;
  --plum:#5B3FA0; --plum-soft:#EFEDFF; --sun:#F6C445; --sun-soft:#FFF3CF;
  --stamp:#D9483B; --ok:#2F8F5B; --ok-soft:#E5F4E4;
  --pink:#FBEBEB; --pink-b:#E9B3AD; --orange:#F9ECE7; --orange-b:#E8BFA8;
  --green:#E5F4E4; --green-b:#A9D3A6; --purple:#EFEDFF; --purple-b:#C3B8EE;
  --blue:#E7F1FB; --blue-b:#A9C9EC; --yellow:#FFF3CF; --yellow-b:#E8C66A;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#18142A; --surface:#231E3A; --ink:#F1EEFA; --muted:#A9A2C4; --line:#3A3358;
    --plum:#B9A3F5; --plum-soft:#2E2650; --sun:#F6C445; --sun-soft:#4A3F1C;
    --stamp:#FF7A6B; --ok:#7FD3A0; --ok-soft:#1F3A2B;
    --pink:#43262A; --pink-b:#7A4A4F; --orange:#45301F; --orange-b:#7D5A3E;
    --green:#1F3A2B; --green-b:#3F6E52; --purple:#2E2650; --purple-b:#5A4C93;
    --blue:#22344A; --blue-b:#41658C; --yellow:#4A3F1C; --yellow-b:#8A7430; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#18142A; --surface:#231E3A; --ink:#F1EEFA; --muted:#A9A2C4; --line:#3A3358;
  --plum:#B9A3F5; --plum-soft:#2E2650; --sun:#F6C445; --sun-soft:#4A3F1C;
  --stamp:#FF7A6B; --ok:#7FD3A0; --ok-soft:#1F3A2B;
  --pink:#43262A; --pink-b:#7A4A4F; --orange:#45301F; --orange-b:#7D5A3E;
  --green:#1F3A2B; --green-b:#3F6E52; --purple:#2E2650; --purple-b:#5A4C93;
  --blue:#22344A; --blue-b:#41658C; --yellow:#4A3F1C; --yellow-b:#8A7430; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none !important}
.wrap{max-width:820px;margin:0 auto;padding:16px}

/* start + finish cards */
.start{min-height:80vh;display:grid;place-items:center}
.ticket{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:28px 24px;max-width:500px;width:100%}
.ticket h1{font-weight:700;font-size:2.1rem;line-height:1.15;margin:0;color:var(--plum)}
.ticket .en{margin:2px 0 18px;color:var(--muted)}
.ticket p{margin:0 0 14px}
label{display:block;font-weight:500;margin-bottom:6px}
input[type=text]{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg)}
input[type=text]:focus{border-color:var(--plum);outline:none}
.primary{display:inline-block;padding:12px 24px;border:0;border-radius:999px;background:var(--plum);color:var(--surface);font-weight:700;font-size:1.05rem}
.ghost{padding:10px 20px;border:2px solid var(--line);border-radius:999px;background:transparent;font-weight:500}
.err{color:var(--stamp);font-size:.95rem;margin-top:8px;min-height:1.4em}
.steps{margin:0 0 16px;padding-left:1.3em}
.steps li{margin-bottom:4px}
details{margin-top:22px;border-top:1px dashed var(--line);padding-top:14px;color:var(--muted);font-size:.95rem}
summary{cursor:pointer}
details .row{display:grid;gap:8px;margin-top:10px}
.check-result{margin-top:6px;font-weight:500;min-height:1.4em}

/* game */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:8px}
.top h1{font-weight:700;font-size:1.6rem;margin:0;color:var(--plum);flex:1 1 auto}
.progress{font-weight:700}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.toggle{padding:6px 14px;border:2px solid var(--line);border-radius:999px;background:var(--surface);font-size:.95rem}
.toggle[aria-pressed="true"]{border-color:var(--plum);background:var(--plum-soft);color:var(--plum);font-weight:700}
.stage{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:4px 0 12px}
.pill{padding:4px 12px;border-radius:999px;background:var(--sun-soft);font-weight:700;font-size:.95rem}
.convtitle{color:var(--muted)}

.chat{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.line{display:flex}
.line.right{justify-content:flex-end}
.bubble{max-width:78%;padding:10px 14px;border-radius:16px;border:2px solid transparent}
.line.left .bubble{border-bottom-left-radius:4px}
.line.right .bubble{border-bottom-right-radius:4px}
.who{display:inline-block;font-size:.85rem;font-weight:700;margin-bottom:2px}
.ko{font-size:1.3rem;font-weight:500;line-height:1.45;word-break:keep-all}
.rom{font-size:.88rem;color:var(--muted)}
.enl{font-size:.88rem;color:var(--muted);font-style:italic}
.no-rom .rom{display:none}
.no-en .enl{display:none}
.blank{display:inline-block;min-width:2.6em;text-align:center;border-bottom:3px solid var(--muted);margin:0 1px;color:transparent;line-height:1.1}
.blank.current{border-color:var(--plum);background:var(--surface);outline:2px solid var(--plum);border-radius:6px;color:var(--plum)}
.fill{color:var(--ok);font-weight:700}
.c-pink{background:var(--pink);border-color:var(--pink-b)}
.c-orange{background:var(--orange);border-color:var(--orange-b)}
.c-green{background:var(--green);border-color:var(--green-b)}
.c-purple{background:var(--purple);border-color:var(--purple-b)}
.c-blue{background:var(--blue);border-color:var(--blue-b)}
.c-yellow{background:var(--yellow);border-color:var(--yellow-b)}
.pop{animation:pop .3s ease-out}
@keyframes pop{0%{transform:translateY(8px);opacity:0}100%{transform:none;opacity:1}}

.feedback{min-height:1.6em;margin:12px 0 6px;font-weight:500;text-align:center}
.feedback.good{color:var(--ok)}
.feedback.bad{color:var(--stamp)}

.poolhead{font-weight:700;margin:6px 0 8px}
.pool{display:grid;gap:10px}
.pool .bubble{max-width:100%;width:100%;text-align:left;cursor:pointer}
.pool .bubble:hover{filter:brightness(.97)}
.choices{display:flex;gap:14px;justify-content:center;margin-top:6px}
.choice{min-width:140px;padding:14px 22px;border:3px solid var(--plum);border-radius:16px;background:var(--surface);color:var(--plum);font-size:1.6rem;font-weight:700}
.choice:hover{background:var(--plum-soft)}
.nextwrap{text-align:center;margin-top:10px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.finish{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 85%,transparent)}
.finish .ticket{text-align:center;border-color:var(--plum)}
.code{font-weight:700;font-size:2rem;letter-spacing:.06em;color:var(--plum);background:var(--plum-soft);border-radius:12px;padding:10px 14px;margin:10px 0;user-select:all}
.finish .small{color:var(--muted);font-size:.95rem}
.finish .actions{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:8px}

@media (max-width:560px){
  .bubble{max-width:90%}
  .ko{font-size:1.15rem}
  .choice{min-width:120px;font-size:1.35rem}
  .top h1{font-size:1.35rem}
}
@media (prefers-reduced-motion: reduce){ .pop,.shake{animation:none} }
</style>
</head>
<body>
<main class="wrap">

  <section class="start" id="start">
    <div class="ticket">
      <h1>대화 만들기</h1>
      <div class="en">Dialogue Builder</div>
      <ol class="steps">
        <li>Tap the lines in order to build each conversation.</li>
        <li>Choose -이에요 or -예요 for each blank.</li>
      </ol>
      <label for="name">Your name, as it appears in Teams</label>
      <input type="text" id="name" autocomplete="name" maxlength="60">
      <div class="err" id="nameErr" role="alert"></div>
      <button class="primary" id="startBtn" type="button">Start</button>
      <details>
        <summary>For teachers: check a code</summary>
        <div class="row">
          <label for="tName" style="margin:0">Student name</label>
          <input type="text" id="tName">
          <label for="tCode" style="margin:0">Code</label>
          <input type="text" id="tCode" placeholder="DB-0-ABCD">
          <div><button class="ghost" id="tCheck" type="button">Check code</button></div>
          <div class="check-result" id="tResult" aria-live="polite"></div>
        </div>
      </details>
    </div>
  </section>

  <section id="game" hidden>
    <div class="top">
      <h1>대화 만들기</h1>
      <div class="progress" id="progress"></div>
      <div class="toggles">
        <button class="toggle" id="romBtn" type="button" aria-pressed="false">Romanization</button>
        <button class="toggle" id="enBtn" type="button" aria-pressed="false">English</button>
        <button class="toggle" id="soundBtn" type="button" aria-pressed="true">Sound</button>
      </div>
    </div>
    <div class="stage"><span class="pill" id="partPill"></span><span class="convtitle" id="convTitle"></span></div>
    <div id="lines" class="no-rom no-en">
      <div class="chat" id="chat" aria-live="polite"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <div id="orderArea">
        <div class="poolhead">Which line comes next?</div>
        <div class="pool" id="pool"></div>
      </div>
    </div>
    <div class="choices" id="choices" hidden>
      <button class="choice" type="button" data-c="이에요" lang="ko">-이에요</button>
      <button class="choice" type="button" data-c="예요" lang="ko">-예요</button>
    </div>
    <div class="nextwrap" id="nextWrap" hidden><button class="primary" id="nextBtn" type="button">Next conversation</button></div>
  </section>

  <section class="finish" id="finish" hidden role="dialog" aria-modal="true" aria-labelledby="finTitle">
    <div class="ticket">
      <h1 id="finTitle">잘했어요!</h1>
      <div class="en">You built all 4 conversations.</div>
      <p id="finName"></p>
      <div class="code" id="finCode"></div>
      <p class="small" id="finTries"></p>
      <p>Paste this code into the Teams assignment.</p>
      <div class="actions">
        <button class="primary" id="copyBtn" type="button">Copy code</button>
        <button class="ghost" id="againBtn" type="button">Play again</button>
      </div>
    </div>
  </section>
</main>

<script>
(function(){
  /* {…} marks a blank; its text is the correct ending. Romanization uses the same marks. */
  const COLORS={'나비':'c-pink','벨라':'c-yellow','하늘':'c-green','아론':'c-purple','하준':'c-blue','유키':'c-purple','엠마':'c-pink','카림':'c-green'};
  const CONVS=[
    {title:'나비 meets 벨라',lines:[
      ['나비','안녕하세요.','an-nyeong-ha-se-yo.','Hello.'],
      ['벨라','안녕하세요.','an-nyeong-ha-se-yo.','Hello.'],
      ['나비','이름이 뭐{예요}?','i-reu-mi mwo-{ye-yo}?','What is your name?'],
      ['벨라','저는 벨라{예요}.','jeo-neun bel-la-{ye-yo}.','I am Bella.'],
      ['나비','어느 나라 사람{이에요}?','eo-neu na-ra sa-ra-{mi-e-yo}?','What country are you from?'],
      ['벨라','브라질 사람{이에요}.','beu-ra-jil sa-ra-{mi-e-yo}.','I am Brazilian.'],
      ['나비','나비{예요}. 만나서 반가워요.','na-bi-{ye-yo}. man-na-seo ban-ga-wo-yo.','I am Nabi. Nice to meet you.'],
      ['벨라','만나서 반가워요.','man-na-seo ban-ga-wo-yo.','Nice to meet you.']]},
    {title:'하늘 meets 아론',lines:[
      ['아론','안녕하세요. 한국 사람{이에요}?','an-nyeong-ha-se-yo. han-guk sa-ra-{mi-e-yo}?','Hello. Are you Korean?'],
      ['하늘','네, 한국 사람{이에요}. 어느 나라 사람{이에요}?','ne, han-guk sa-ra-{mi-e-yo}. eo-neu na-ra sa-ra-{mi-e-yo}?','Yes, I am Korean. What country are you from?'],
      ['아론','저는 미국 사람{이에요}. 저는 아론{이에요}.','jeo-neun mi-guk sa-ra-{mi-e-yo}. jeo-neun a-ro-{ni-e-yo}.','I am American. I am Aaron.'],
      ['하늘','저는 하늘{이에요}. 만나서 반가워요.','jeo-neun ha-neu-{ri-e-yo}. man-na-seo ban-ga-wo-yo.','I am Haneul. Nice to meet you.']]},
    {title:'하준 meets 유키',lines:[
      ['하준','안녕하세요.','an-nyeong-ha-se-yo.','Hello.'],
      ['유키','안녕하세요.','an-nyeong-ha-se-yo.','Hello.'],
      ['하준','이름이 뭐{예요}?','i-reu-mi mwo-{ye-yo}?','What is your name?'],
      ['유키','저는 유키{예요}.','jeo-neun yu-ki-{ye-yo}.','I am Yuki.'],
      ['하준','어느 나라 사람{이에요}?','eo-neu na-ra sa-ra-{mi-e-yo}?','What country are you from?'],
      ['유키','저는 일본 사람{이에요}.','jeo-neun il-bon sa-ra-{mi-e-yo}.','I am Japanese.'],
      ['하준','저는 하준{이에요}. 만나서 반가워요.','jeo-neun ha-ju-{ni-e-yo}. man-na-seo ban-ga-wo-yo.','I am Hajun. Nice to meet you.'],
      ['유키','만나서 반가워요.','man-na-seo ban-ga-wo-yo.','Nice to meet you.']]},
    {title:'엠마 meets 카림',lines:[
      ['엠마','안녕하세요. 이름이 뭐{예요}?','an-nyeong-ha-se-yo. i-reu-mi mwo-{ye-yo}?','Hello. What is your name?'],
      ['카림','저는 카림{이에요}.','jeo-neun ka-ri-{mi-e-yo}.','I am Karim.'],
      ['엠마','이집트 사람{이에요}?','i-jip-teu sa-ra-{mi-e-yo}?','Are you Egyptian?'],
      ['카림','네, 이집트 사람{이에요}. 어느 나라 사람{이에요}?','ne, i-jip-teu sa-ra-{mi-e-yo}. eo-neu na-ra sa-ra-{mi-e-yo}?','Yes, I am Egyptian. What country are you from?'],
      ['엠마','저는 영국 사람{이에요}. 저는 엠마{예요}.','jeo-neun yeong-guk sa-ra-{mi-e-yo}. jeo-neun em-ma-{ye-yo}.','I am British. I am Emma.'],
      ['카림','만나서 반가워요.','man-na-seo ban-ga-wo-yo.','Nice to meet you.']]}
  ];

  const $=id=>document.getElementById(id);
  let player='', ci=0, placed=1, phase='order', blanks=[], bi=0, mistakes=0, order=[];
  let soundOn=true, actx=null;

  function tone(freqs,gap,vol){
    if(!soundOn) return;
    try{
      actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      const t0=actx.currentTime+0.02;
      freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;const t=t0+i*gap;
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
        o.connect(g).connect(actx.destination);o.start(t);o.stop(t+0.4);});
    }catch(e){}
  }
  const ding=()=>tone([659.25,987.77],0.07,0.12);
  const cheer=()=>tone([523.25,659.25,783.99,1046.5],0.08,0.16);

  const ALPH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const norm=s=>s.normalize('NFC').trim().toLowerCase().replace(/\s+/g,' ');
  function fnv(s){let h=2166136261;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
  function makeCode(name,m){let h=fnv('DB1|'+norm(name)+'|'+m),s='';for(let i=0;i<4;i++){s+=ALPH[h%ALPH.length];h=Math.floor(h/ALPH.length);}return 'DB-'+m+'-'+s;}

  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

  /* render a template: filled blanks show their text, others an empty slot */
  function renderKo(tpl,li){
    let k=0;
    return esc(tpl).replace(/\{([^}]*)\}/g,(m,ans)=>{
      const key=li+':'+(k++); const b=blanks.find(x=>x.key===key);
      if(b&&b.done) return '<span class="fill">'+ans+'</span>';
      const cur=(phase==='fill'&&blanks[bi]&&blanks[bi].key===key)?' current':'';
      return '<span class="blank'+cur+'" aria-label="blank">___</span>';
    });
  }
  function renderRom(tpl,li){
    let k=0;
    return esc(tpl).replace(/\{([^}]*)\}/g,(m,ans)=>{const b=blanks.find(x=>x.key===li+':'+(k++));return b&&b.done?ans:'___';});
  }
  function bubbleHTML(L,li){
    return '<span class="who" lang="ko">'+L[0]+'</span><div class="ko" lang="ko">'+renderKo(L[1],li)+'</div><div class="rom">'+renderRom(L[2],li)+'</div><div class="enl">'+esc(L[3])+'</div>';
  }

  function startConv(){
    const C=CONVS[ci]; placed=1; phase='order'; bi=0;
    blanks=[]; C.lines.forEach((L,li)=>{let k=0;(L[1].match(/\{[^}]*\}/g)||[]).forEach(m=>blanks.push({key:li+':'+(k++),ans:m.slice(1,-1),done:false}));});
    order=shuffle(C.lines.map((_,i)=>i).slice(1));
    $('nextWrap').hidden=true; say('','');
    render();
  }
  function render(){
    const C=CONVS[ci], first=C.lines[0][0];
    $('progress').textContent='Conversation '+(ci+1)+' of '+CONVS.length;
    $('convTitle').textContent=C.title;
    $('partPill').textContent= phase==='order'?'Part 1 · Put the lines in order': phase==='fill'?'Part 2 · Choose the ending':'Done!';
    const chat=$('chat'); chat.innerHTML='';
    for(let i=0;i<placed;i++){
      const L=C.lines[i], row=document.createElement('div');
      row.className='line '+(L[0]===first?'left':'right');
      row.innerHTML='<div class="bubble '+COLORS[L[0]]+'">'+bubbleHTML(L,i)+'</div>';
      chat.appendChild(row);
    }
    $('orderArea').hidden=phase!=='order';
    $('choices').hidden=phase!=='fill';
    if(phase==='order'){
      const pool=$('pool'); pool.innerHTML='';
      order.filter(i=>i>=placed).forEach(i=>{
        const L=C.lines[i], b=document.createElement('button');
        b.type='button'; b.className='bubble '+COLORS[L[0]]; b.innerHTML=bubbleHTML(L,i); b.dataset.i=i;
        b.addEventListener('click',()=>pick(i,b)); pool.appendChild(b);
      });
    }
  }
  function lastRowPop(){ const r=$('chat').lastElementChild; if(r) r.classList.add('pop'); }
  function pick(i,el){
    if(i===placed){
      placed++; ding();
      if(placed===CONVS[ci].lines.length){ phase = blanks.length?'fill':'done'; render(); lastRowPop();
        if(phase==='fill') say('Now choose -이에요 or -예요 for each blank.',''); else convDone(); }
      else { render(); lastRowPop(); say('',''); }
    }else{
      mistakes++; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
      say('Not yet. Read the last line in the chat. What would the other person say next?','bad');
    }
  }
  document.querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>{
    if(phase!=='fill') return;
    const b=blanks[bi];
    if(btn.dataset.c===b.ans){
      b.done=true; bi++; ding();
      if(bi>=blanks.length){ phase='done'; render(); convDone(); }
      else { render(); say('맞아요!','good'); }
    }else{
      mistakes++; btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
      say('Look at the block right before the blank. Does it have a 받침 (a bottom consonant)?','bad');
    }
  }));
  function convDone(){
    cheer();
    $('choices').hidden=true;
    if(ci<CONVS.length-1){ say('잘했어요! Conversation complete.','good'); $('nextWrap').hidden=false; $('nextBtn').focus(); }
    else setTimeout(finish,900);
  }
  $('nextBtn').addEventListener('click',()=>{ ci++; startConv(); window.scrollTo(0,0); });

  function say(t,cls){const f=$('feedback'); f.textContent=t; f.className='feedback'+(cls?' '+cls:'');}

  function toggle(id,cls){ $(id).addEventListener('click',e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);$('lines').classList.toggle(cls,!on);}); }
  toggle('romBtn','no-rom'); toggle('enBtn','no-en');
  $('soundBtn').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.setAttribute('aria-pressed',soundOn);});

  function finish(){
    $('finName').textContent=player;
    $('finCode').textContent=makeCode(player,mistakes);
    $('finTries').textContent= mistakes===0?'No wrong tries. Excellent!':(mistakes===1?'1 wrong try along the way.':mistakes+' wrong tries along the way.');
    $('copyBtn').textContent='Copy code'; $('finish').hidden=false; $('copyBtn').focus();
  }
  $('copyBtn').addEventListener('click',()=>{
    const code=$('finCode').textContent, done=()=>{$('copyBtn').textContent='Copied';};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done,selectCode);}else selectCode();
  });
  function selectCode(){const r=document.createRange();r.selectNodeContents($('finCode'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('copyBtn').textContent='Press Ctrl+C to copy';}
  $('againBtn').addEventListener('click',()=>{ $('finish').hidden=true; ci=0; mistakes=0; startConv(); window.scrollTo(0,0); });

  function start(){
    const n=$('name').value.trim();
    if(!n){ $('nameErr').textContent='Type your name first. It becomes part of your code.'; $('name').focus(); return; }
    player=n; $('nameErr').textContent=''; $('start').hidden=true; $('game').hidden=false; ci=0; mistakes=0; startConv();
  }
  $('startBtn').addEventListener('click',start);
  $('name').addEventListener('keydown',e=>{if(e.key==='Enter')start();});

  $('tCheck').addEventListener('click',()=>{
    const n=$('tName').value, c=$('tCode').value.trim().toUpperCase(), r=$('tResult');
    const m=c.match(/^DB-(\d{1,3})-([A-Z0-9]{4})$/);
    if(!n.trim()||!m){ r.textContent='Enter the student’s name and a code like DB-2-ABCD.'; return; }
    r.textContent= makeCode(n,Number(m[1]))===c
      ? 'Valid code. All 4 conversations completed. '+(m[1]==='0'?'No wrong tries.':m[1]+' wrong '+(m[1]==='1'?'try':'tries')+'.')
      : 'This code doesn’t match that name. Check the spelling of the name.';
  });
})();
</script>
</body>
</html>
