<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나라 매치 · Country Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAFF; --surface:#FFFFFF; --ink:#2A2340; --muted:#6B6385; --line:#DDD6EE;
  --plum:#5B3FA0; --plum-soft:#EFEDFF; --sky:#E6F1FA; --sun:#F6C445; --sun-soft:#FFF3CF;
  --stamp:#D9483B; --ok:#2F8F5B; --ok-soft:#E5F4E4;
  --display:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#18142A; --surface:#231E3A; --ink:#F1EEFA; --muted:#A9A2C4; --line:#3A3358;
    --plum:#B9A3F5; --plum-soft:#2E2650; --sky:#2C3550; --sun:#F6C445; --sun-soft:#4A3F1C;
    --stamp:#FF7A6B; --ok:#7FD3A0; --ok-soft:#1F3A2B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#18142A; --surface:#231E3A; --ink:#F1EEFA; --muted:#A9A2C4; --line:#3A3358;
  --plum:#B9A3F5; --plum-soft:#2E2650; --sky:#2C3550; --sun:#F6C445; --sun-soft:#4A3F1C;
  --stamp:#FF7A6B; --ok:#7FD3A0; --ok-soft:#1F3A2B; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
[hidden]{display:none !important}

.start{min-height:80vh;display:grid;place-items:center}
.ticket{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:28px 24px;max-width:500px;width:100%}
.ticket h1{font-family:var(--display);font-weight:700;font-size:2.2rem;line-height:1.1;margin:0;color:var(--plum)}
.ticket .en{margin:2px 0 18px;color:var(--muted)}
.ticket p{margin:0 0 16px}
label{display:block;font-weight:500;margin-bottom:6px}
input[type=text]{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg)}
input[type=text]:focus{border-color:var(--plum);outline:none}
.rounds{display:grid;gap:10px;margin-top:16px}
.roundbtn{display:flex;align-items:center;gap:14px;text-align:left;padding:12px 16px;border:2px solid var(--line);border-radius:16px;background:var(--bg)}
.roundbtn:hover{border-color:var(--plum)}
.roundbtn .num{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--plum);color:var(--surface);font-weight:700}
.roundbtn .t{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.3;display:block}
.roundbtn .d{color:var(--muted);font-size:.92rem;display:block}
.roundbtn .done{margin-left:auto;color:var(--ok);font-weight:700;font-size:.9rem}
.primary{display:inline-block;margin-top:14px;padding:12px 22px;border:0;border-radius:999px;background:var(--plum);color:var(--surface);font-weight:700;font-size:1.05rem}
.err{color:var(--stamp);font-size:.95rem;margin-top:8px;min-height:1.4em}
.sofar{margin-top:14px;padding:10px 14px;border-radius:12px;background:var(--plum-soft);text-align:center}
.sofar b{display:block;font-size:1.5rem;letter-spacing:.06em;color:var(--plum);user-select:all}
details{margin-top:22px;border-top:1px dashed var(--line);padding-top:14px;color:var(--muted);font-size:.95rem}
summary{cursor:pointer}
details .row{display:grid;gap:8px;margin-top:10px}
details input{font-size:.95rem}
.check-result{margin-top:6px;font-weight:500;min-height:1.4em}
.ghost{padding:8px 16px;border:2px solid var(--line);border-radius:999px;background:transparent;font-weight:500}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:6px}
.top h1{font-family:var(--display);font-weight:700;font-size:1.7rem;margin:0;color:var(--plum);flex:1 1 auto}
.progress{font-weight:700}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.toggle{padding:6px 14px;border:2px solid var(--line);border-radius:999px;background:var(--surface);font-size:.95rem}
.toggle[aria-pressed="true"]{border-color:var(--plum);background:var(--plum-soft);color:var(--plum);font-weight:700}
.how{color:var(--muted);margin:0 0 10px}

.tray{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 12px;border-bottom:2px solid var(--line);margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:flex;flex-direction:column;align-items:center;min-width:92px;padding:8px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);transition:transform .12s}
.chip .ko{font-family:var(--display);font-weight:500;font-size:1.6rem;line-height:1.3;white-space:nowrap}
.chip .rom{font-size:.8rem;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--sun);background:var(--sun-soft);transform:translateY(-2px)}
.chip.done{opacity:.35;border-style:dashed;cursor:default}
.no-rom .rom{display:none}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;padding:0;border:2px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;text-align:center}
.card .art{background:var(--sky);aspect-ratio:4/3;display:grid;place-items:center}
.card .art img{width:100%;height:100%;object-fit:cover;display:block}
.card .art svg{width:100%;height:100%;display:block}
.grid.people{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid.people .card .art{aspect-ratio:3/4;background:#fff}
.grid.people .card .art img{object-position:top}
.card .cap{padding:8px 6px 10px;font-weight:500;font-size:.95rem}
.card .cap .who{display:block;font-family:var(--display);font-weight:500;font-size:1.3rem;line-height:1.3}
.card .cap .say{display:block;color:var(--muted)}
.card[aria-pressed="true"]{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun)}
.card.done{border-color:var(--ok);cursor:default}
.card.done .cap{background:var(--ok-soft);color:var(--ok)}
.card.done .cap .say{color:var(--ok)}
.stamp{position:absolute;top:8%;right:5%;width:42%;aspect-ratio:1;border:4px double var(--stamp);border-radius:50%;display:grid;place-items:center;text-align:center;line-height:1.1;padding:4px;color:var(--stamp);font-family:var(--display);font-weight:500;font-size:clamp(1rem,3.4vw,1.7rem);transform:rotate(-14deg);background:color-mix(in srgb,var(--surface) 88%,transparent);pointer-events:none}
.stamp.sm{top:3%;right:3%;width:46%;white-space:nowrap;font-size:clamp(.7rem,1.7vw,1.05rem)}
.stamp.pop{animation:stamp .35s ease-out}
@keyframes stamp{0%{transform:rotate(-14deg) scale(1.8);opacity:0}70%{transform:rotate(-14deg) scale(.92);opacity:1}100%{transform:rotate(-14deg) scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.feedback{min-height:1.6em;margin:14px 0 0;font-weight:500;text-align:center}
.feedback.good{color:var(--ok)}
.feedback.bad{color:var(--stamp)}
.backlink{margin-top:10px;text-align:center}

.finish{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 80%,transparent)}
.finish .ticket{text-align:center;border-color:var(--plum)}
.code{font-family:var(--display);font-weight:700;font-size:2.1rem;letter-spacing:.06em;color:var(--plum);background:var(--plum-soft);border-radius:12px;padding:10px 14px;margin:10px 0;user-select:all}
.finish .small{color:var(--muted);font-size:.95rem}
.finish .actions{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:8px}
.finish .actions .primary{margin-top:0}
.finish .actions .ghost{padding:12px 22px}

@media (max-width:640px){
  .grid,.grid.people{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .chip{min-width:76px;padding:6px 10px}
  .chip .ko{font-size:1.3rem}
  .top h1{font-size:1.45rem}
}
@media (prefers-reduced-motion: reduce){ .stamp.pop,.shake{animation:none} .chip{transition:none} }
</style>
</head>
<body>
<main class="wrap">

  <section class="start" id="start">
    <div class="ticket">
      <h1>나라 매치</h1>
      <div class="en">Country Match</div>
      <label for="name">Your name, as it appears in Teams</label>
      <input type="text" id="name" autocomplete="name" maxlength="60">
      <div class="err" id="nameErr" role="alert"></div>
      <div class="rounds" id="rounds"></div>
      <div class="sofar" id="soFar" hidden></div>
      <details>
        <summary>For teachers: check a code</summary>
        <div class="row">
          <label for="tName" style="margin:0">Student name</label>
          <input type="text" id="tName">
          <label for="tCode" style="margin:0">Code</label>
          <input type="text" id="tCode" placeholder="CM-12-0-ABCD">
          <div><button class="ghost" id="tCheck" type="button">Check code</button></div>
          <div class="check-result" id="tResult" aria-live="polite"></div>
        </div>
      </details>
    </div>
  </section>

  <section id="game" hidden>
    <div class="top">
      <h1 id="gTitle"></h1>
      <div class="progress" id="progress"></div>
      <div class="toggles">
        <button class="toggle" id="romBtn" type="button" aria-pressed="false">Romanization</button>
        <button class="toggle" id="soundBtn" type="button" aria-pressed="true" hidden>Sound</button>
      </div>
    </div>
    <p class="how" id="how"></p>
    <div class="tray"><div class="chips no-rom" id="chips"></div></div>
    <div class="grid" id="grid"></div>
    <p class="feedback" id="feedback" aria-live="polite"></p>
    <div class="backlink"><button class="ghost" id="menuBtn" type="button">Back to rounds</button></div>
  </section>

  <section class="finish" id="finish" hidden role="dialog" aria-modal="true" aria-labelledby="finTitle">
    <div class="ticket">
      <h1 id="finTitle">모두 맞았어요!</h1>
      <div class="en" id="finSub"></div>
      <p id="finName"></p>
      <div class="code" id="finCode"></div>
      <p class="small" id="finTries"></p>
      <p id="finNote"></p>
      <div class="actions">
        <button class="primary" id="copyBtn" type="button">Copy code</button>
        <button class="ghost" id="nextBtn" type="button"></button>
      </div>
    </div>
  </section>

</main>

  }

  /* codes */
  const ALPH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const norm=s=>s.normalize('NFC').trim().toLowerCase().replace(/\s+/g,' ');
  function fnv(s){let h=2166136261;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
  function makeCode(round,name,m){
    let h=fnv(ROUNDS[round].salt+'|'+norm(name)+'|'+m), s='';
    for(let i=0;i<4;i++){s+=ALPH[h%ALPH.length];h=Math.floor(h/ALPH.length);}
    return round+'-'+m+'-'+s;
  }

  const finished={}, mistakesBy={};
  function comboFrom(name,rs,total){
    let h=fnv('CM1|'+norm(name)+'|'+rs+'|'+total), s='';
    for(let i=0;i<4;i++){s+=ALPH[h%ALPH.length];h=Math.floor(h/ALPH.length);}
    return 'CM-'+rs+'-'+total+'-'+s;
  }
  function comboCode(name){
    const rs=(finished.LM?'1':'')+(finished.PM?'2':'');
    const total=(finished.LM?mistakesBy.LM:0)+(finished.PM?mistakesBy.PM:0);
    return comboFrom(name,rs,total);
  }

  let soundOn=true; $('soundBtn').hidden=false;
  let clip=null, actx=null;
  function chime(){
    if(!soundOn) return;
    try{
      actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      const t0=actx.currentTime+0.02;
      [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
        const o=actx.createOscillator(), g=actx.createGain();
        o.type='triangle'; o.frequency.value=f;
        const t=t0+i*0.08;
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(0.16,t+0.015);
        g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
        o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.45);
      });
    }catch(e){}
  }
  function cheer(){ if(clip && !clip.paused && !clip.ended){ clip.addEventListener('ended',chime,{once:true}); } else chime(); }
  function speak(id){ if(!soundOn) return; const src=AUDIO[round][id]; if(!src) return; try{ if(clip) clip.pause(); clip=new Audio(src); clip.play().catch(()=>{}); }catch(e){} }
  $('soundBtn').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.setAttribute('aria-pressed',soundOn);});
  $('romBtn').addEventListener('click',e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);$('chips').classList.toggle('no-rom',!on);});

  function buildRounds(){
    $('rounds').innerHTML=Object.entries(ROUNDS).map(([k,r])=>
      '<button class="roundbtn" type="button" data-r="'+k+'"><span class="num">'+r.n+'</span><span><span class="t" lang="ko">'+r.title+'</span><span class="d">Round '+r.n+' · '+r.sub+'. '+r.desc+'</span></span>'+(finished[k]?'<span class="done">Done</span>':'')+'</button>').join('');
    document.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>begin(b.dataset.r)));
    const sf=$('soFar');
    if(player && (finished.LM||finished.PM)){ sf.hidden=false; sf.innerHTML='Your code so far:<b>'+comboCode(player)+'</b>'; } else sf.hidden=true;
  }
  function begin(r){
    const n=$('name').value.trim();
    if(!n){ $('nameErr').textContent='Type your name first. It becomes part of your code.'; $('name').focus(); return; }
    player=n; $('nameErr').textContent=''; round=r;
    $('start').hidden=true; $('game').hidden=false; $('finish').hidden=true; build(); window.scrollTo(0,0);
  }
  $('menuBtn').addEventListener('click',()=>{ $('game').hidden=true; $('start').hidden=false; buildRounds(); });

  function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function build(){
    const R=ROUNDS[round], chips=$('chips'), grid=$('grid');
    $('gTitle').textContent=R.title; $('how').textContent=R.how;
    chips.innerHTML=''; grid.innerHTML='';
    shuffle(R.items).forEach(c=>{
      const b=document.createElement('button'); b.type='button'; b.className='chip'; b.dataset.id=c.id; b.setAttribute('aria-pressed','false');
      b.innerHTML='<span class="ko" lang="ko">'+R.chipKo(c)+'</span><span class="rom">'+R.chipRom(c)+'</span>';
      b.addEventListener('click',()=>pickC(c.id,b)); chips.appendChild(b);
    });
    grid.className='grid'+(round==='PM'?' people':'');
    shuffle(R.items).forEach(c=>{
      const b=document.createElement('button'); b.type='button'; b.className='card'; b.dataset.id=c.id; b.setAttribute('aria-pressed','false');
      b.setAttribute('aria-label',R.label(c)); b.innerHTML=R.card(c);
      b.addEventListener('click',()=>pickL(c.id,b)); grid.appendChild(b);
    });
    selC=selL=null; matched=new Set(); mistakes=0; updateProgress(); say('','');
  }
  const chipEl=id=>document.querySelector('.chip[data-id="'+id+'"]');
  const cardEl=id=>document.querySelector('.card[data-id="'+id+'"]');
  function clearSel(){ document.querySelectorAll('.chip[aria-pressed="true"],.card[aria-pressed="true"]').forEach(x=>x.setAttribute('aria-pressed','false')); selC=selL=null; }
  function pickC(id,el){
    if(matched.has(id)) return;
    if(selC===id){ el.setAttribute('aria-pressed','false'); selC=null; return; }
    if(selC) chipEl(selC).setAttribute('aria-pressed','false');
    selC=id; el.setAttribute('aria-pressed','true'); speak(id);
    if(selL) tryMatch();
  }
  function pickL(id,el){
    if(matched.has(id)) return;
    if(selL===id){ el.setAttribute('aria-pressed','false'); selL=null; return; }
    if(selL) cardEl(selL).setAttribute('aria-pressed','false');
    selL=id; el.setAttribute('aria-pressed','true');
    if(selC) tryMatch(); else say(round==='LM'?'Now tap the country name for this landmark.':'Now tap the words for where this person is from.','');
  }
  function tryMatch(){
    const R=ROUNDS[round], c=selC, l=selL, ce=chipEl(c), le=cardEl(l);
    if(c===l){
      matched.add(c); cheer();
      ce.classList.add('done'); ce.setAttribute('aria-disabled','true');
      le.classList.add('done'); le.setAttribute('aria-disabled','true');
      const st=document.createElement('div'); st.className='stamp pop'+(R.stampSm?' sm':''); st.lang='ko'; st.textContent=R.chipKo(byId[c]);
      le.appendChild(st); le.setAttribute('aria-label',R.label(byId[c])+', matched with '+R.chipKo(byId[c]));
      say(round==='LM' ? '맞아요! '+byId[c].ko+' · '+byId[c].landmark : '맞아요! '+byId[c].who+': 저는 '+byId[c].ko+' 사람이에요.','good');
      clearSel(); updateProgress();
      if(matched.size===R.items.length) setTimeout(finish,900);
    }else{
      mistakes++;
      [ce,le].forEach(x=>{x.classList.remove('shake');void x.offsetWidth;x.classList.add('shake');});
      say('다시 해 보세요. Try again.','bad'); clearSel();
    }
  }
  function say(t,cls){const f=$('feedback'); f.textContent=t; f.className='feedback'+(cls?' '+cls:'');}
  function updateProgress(){ $('progress').textContent=matched.size+' / '+ROUNDS[round].items.length+' matched'; }

  function finish(){
    finished[round]=true; mistakesBy[round]=mistakes;
    const other=round==='LM'?'PM':'LM', both=finished.LM&&finished.PM;
    $('finSub').textContent='Round '+ROUNDS[round].n+' · '+ROUNDS[round].sub+': you matched all '+ROUNDS[round].items.length+'.';
    $('finName').textContent=player;
    $('finCode').textContent=comboCode(player);
    const t=k=>k===0?'no wrong tries':(k===1?'1 wrong try':k+' wrong tries');
    const parts=[]; if(finished.LM) parts.push('Round 1: '+t(mistakesBy.LM)); if(finished.PM) parts.push('Round 2: '+t(mistakesBy.PM));
    $('finTries').textContent=parts.join(' · ')+'.';
    $('finNote').textContent= both ? 'Paste this one code into the Teams assignment. It covers both rounds.' : 'Paste this code into the Teams assignment. If you also play Round '+ROUNDS[other].n+', you’ll get one new code that covers both rounds.';
    const nb=$('nextBtn');
    if(finished[other]){ nb.textContent='Back to rounds'; nb.onclick=()=>{ $('finish').hidden=true; $('game').hidden=true; $('start').hidden=false; buildRounds(); }; }
    else { nb.textContent='Play Round '+ROUNDS[other].n; nb.onclick=()=>begin(other); }
    $('copyBtn').textContent='Copy code';
    $('finish').hidden=false; $('copyBtn').focus();
  }
  $('copyBtn').addEventListener('click',()=>{
    const code=$('finCode').textContent, done=()=>{$('copyBtn').textContent='Copied';};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done,selectCode);}else selectCode();
  });
  function selectCode(){const r=document.createRange();r.selectNodeContents($('finCode'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('copyBtn').textContent='Press Ctrl+C to copy';}

  $('tCheck').addEventListener('click',()=>{
    const n=$('tName').value, c=$('tCode').value.trim().toUpperCase(), r=$('tResult');
    const cm=c.match(/^CM-(1|2|12)-(\d{1,3})-([A-Z0-9]{4})$/);
    if(n.trim()&&cm){
      const which=cm[1]==='12'?'Rounds 1 and 2 completed.':'Round '+cm[1]+' only completed.';
      const tr=cm[2]==='0'?'No wrong tries.':cm[2]+' wrong '+(cm[2]==='1'?'try':'tries')+' in total.';
      r.textContent= comboFrom(n,cm[1],Number(cm[2]))===c ? 'Valid code. '+which+' '+tr : 'This code doesn’t match that name. Check the spelling of the name.';
      return;
    }
    const m=c.match(/^(LM|PM)-(\d{1,3})-([A-Z0-9]{4})$/);
    if(!n.trim()||!m){ r.textContent='Enter the student’s name and a code like CM-12-0-ABCD.'; return; }
    const rn='Round '+ROUNDS[m[1]].n+' ('+ROUNDS[m[1]].sub+')';
    r.textContent = makeCode(m[1],n,Number(m[2]))===c
      ? 'Valid code for '+rn+'. '+(m[2]==='0'?'No wrong tries.':m[2]+' wrong '+(m[2]==='1'?'try':'tries')+'.')
      : 'This code doesn’t match that name. Check the spelling of the name.';
  });
  $('name').addEventListener('keydown',e=>{if(e.key==='Enter') begin('LM');});

  buildRounds();
})();
</script>
</body>
</html>
